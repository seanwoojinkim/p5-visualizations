# EEG Neurofeedback Monitor Configuration
# Default configuration for Muse 2 headset integration

# Muse 2 Headset Connection Settings
muse:
  # LSL stream discovery settings
  stream_type: "EEG"
  connection_timeout: 10  # seconds to wait for stream discovery
  reconnect_delay: 5      # seconds to wait before reconnect attempt
  max_reconnect_attempts: 5

  # Expected hardware parameters
  sample_rate: 256        # Hz - Muse 2 nominal sample rate
  channel_count: 4        # TP9, AF7, AF8, TP10
  channel_names:
    - "TP9"   # Left ear
    - "AF7"   # Left forehead
    - "AF8"   # Right forehead
    - "TP10"  # Right ear

# Signal Processing Configuration
signal_processing:
  # Basic parameters
  sample_rate: 256        # Hz - must match Muse 2 hardware
  window_duration: 2.0    # seconds - controls frequency resolution
  window_overlap: 0.5     # 50% overlap for Welch's method (0.0-0.99)

  # Phase 7: Enable advanced processing (artifact rejection, adaptive filtering, quality assessment)
  use_advanced_processing: true

  # Frequency band definitions (Hz)
  frequency_bands:
    delta: [0.5, 4]       # Deep sleep, unconscious processes
    theta: [4, 8]         # Meditation, creativity, memory
    alpha: [8, 13]        # Relaxation, calm focus, wakeful rest
    beta: [12, 30]        # Active thinking, concentration, alertness
    gamma: [30, 50]       # High-level cognition, learning

  # Bandpass filter configuration (basic, superseded by adaptive filtering)
  bandpass:
    enabled: true         # Set false to disable bandpass filtering
    low_cutoff: 0.5       # Hz - removes DC drift
    high_cutoff: 50       # Hz - removes high-frequency noise
    order: 4              # Filter order (higher = steeper rolloff)

  # Notch filter configuration (basic, superseded by adaptive filtering)
  notch:
    enabled: true         # Set false to disable notch filtering
    frequency: 60         # Hz - Line noise (use 50 for Europe/Asia)
    quality_factor: 30    # Q factor (higher = narrower notch)

  # Phase 7: Advanced Artifact Rejection
  artifacts:
    enabled: true         # Set false to disable artifact detection
    blink_threshold: 150  # microvolts - eye blink detection threshold (increased from 100)
    movement_threshold: 100  # microvolts - movement artifact threshold
    jaw_freq_range: [30, 100]  # Hz - frequency range for jaw muscle activity
    jaw_power_threshold: 2.0  # Power ratio threshold for jaw clenches
    pop_gradient_threshold: 50  # µV/sample - electrode pop detection
    eye_movement_correlation: -0.5  # Correlation threshold for eye movements
    rejection_threshold: 0.15  # Maximum acceptable artifact ratio (15%)

  # Phase 7: Adaptive Filtering (auto-adjusts to signal characteristics)
  adaptive_filtering:
    enabled: true         # Enable adaptive filtering
    auto_detect_line_noise: true  # Auto-detect 50 vs 60 Hz line noise
    force_line_freq: null  # Force specific frequency (Hz) or null for auto
    notch_q_factor: 30    # Quality factor for adaptive notch filter
    dc_cutoff: 0.5        # Hz - high-pass cutoff for DC drift removal
    dc_order: 2           # Filter order for DC removal
    detection_threshold: 1.5  # Power ratio to detect line noise
    update_interval: 2560  # Samples between detection updates (~10s at 256 Hz)

  # Phase 7: Signal Quality Assessment
  quality_assessment:
    enabled: true         # Enable quality assessment
    history_size: 60      # Number of measurements to track (~1 minute)
    snr_weight: 0.3       # Weight for SNR in composite score
    impedance_weight: 0.3  # Weight for impedance in composite score
    purity_weight: 0.2    # Weight for spectral purity
    stability_weight: 0.2  # Weight for temporal stability
    min_amplitude: 5.0    # Minimum expected amplitude (µV)
    max_amplitude: 100.0  # Maximum expected amplitude (µV)

  # Performance tuning (advanced)
  # buffer_size_multiplier: 3  # Buffer size = window_size × multiplier
  # welch_segment_size: 256    # Segment size for Welch's method (null = auto)

# Protocol Selection and Settings
protocols:
  # Default protocol to use on startup
  default: "alpha_enhancement"

  # Update rate for metric calculation
  update_interval: 1.0    # seconds

  # Baseline calibration
  baseline:
    enabled: false        # Set true to require baseline before training
    duration: 60          # seconds of eyes-closed rest
    auto_update: false    # Continuously update baseline during training

# WebSocket Server Configuration
websocket:
  host: "0.0.0.0"        # Bind to all interfaces
  port: 8766             # Different from HRV monitor (8765)

  # CORS settings
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5500"
    - "http://127.0.0.1:5500"

  # Rate limiting and security
  max_clients: 10
  max_message_size: 1024  # bytes
  max_messages_per_second: 10

  # Message streaming options
  stream_band_powers: true      # Send raw band powers
  stream_protocol_metrics: true # Send protocol-specific metrics
  stream_raw_waveform: false    # Send raw EEG (high bandwidth!)

# Logging Configuration
logging:
  level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  console: true
  file: "logs/eeg_monitor.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Log rotation
  max_file_size: 10485760  # bytes (10MB)
  backup_count: 5

# Session Recording (for later phases)
recording:
  enabled: false
  directory: "sessions"
  format: "hdf5"         # or "csv"
  include_raw_eeg: false
